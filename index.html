mulaattoria.","Python as well as a simulator are used in the work.","Coordinating conjunction","sekä","Joins Pythonia and simulaattoria, two partitive objects."],[324,"Academic connectors and phrases","tai","or","Robotti voi pysähtyä tai antaa hälytyksen.","The robot can stop or give an alert.","Coordinating conjunction","tai","Joins two alternative infinitives, pysähtyä and antaa."],[325,"Academic connectors and phrases","esimerkiksi","for example","Poikkeama voi olla esimerkiksi väärä komento.","An anomaly can be, for example, an incorrect command.","Adverb","esimerkiksi","Introduces an example within the sentence."],[326,"Academic connectors and phrases","lisäksi","in addition","Lisäksi järjestelmä tallentaa lokitietoja.","In addition, the system stores log data.","Adverb / connector","Lisäksi","Adds information; appears at the start of the sentence."],[327,"Academic connectors and phrases","kuitenkin","however","Menetelmä voi toimia, mutta tulokset pitää kuitenkin arvioida.","The method may work, but the results must still be evaluated.","Adverb / connector","kuitenkin","Signals contrast within the second clause."],[328,"Academic connectors and phrases","toisaalta","on the other hand","Pilvi tarjoaa palveluja, mutta toisaalta paikallinen ohjaus voi toimia ilman pilveä.","The cloud offers services, but on the other hand local control can work without it.","Adverb / connector","toisaalta","Introduces a contrasting viewpoint in the second clause."],[329,"Academic connectors and phrases","sen sijaan","instead","Robotti voi pysähtyä sen sijaan, että se jatkaisi vaarallista liikettä.","The robot can stop instead of continuing a dangerous movement.","Postposition phrase","sen sijaan","Sen sijaan, että + clause expresses an alternative; jatkaisi is conditional."],[330,"Academic connectors and phrases","ensiksi","first","Ensiksi määritellään tutkimuskysymys.","First, the research question is defined.","Adverb","Ensiksi","Marks the first step; the verb määritellään is passive present."],[331,"Academic connectors and phrases","seuraavaksi","next","Seuraavaksi rakennetaan simulaatio.","Next, the simulation is built.","Adverb","Seuraavaksi","Marks the next step; rakennetaan is passive present."],[332,"Academic connectors and phrases","lopuksi","finally","Lopuksi arvioidaan tulokset.","Finally, the results are evaluated.","Adverb","Lopuksi","Marks the final step; arvioidaan is passive present."],[333,"Academic connectors and phrases","aluksi","initially","Aluksi testataan normaali toiminta.","Initially, normal operation is tested.","Adverb","Aluksi","Marks the initial step; testataan is passive present."],[334,"Academic connectors and phrases","tämän vuoksi","for this reason","Viive voi kasvaa, ja tämän vuoksi mittaan sitä.","Latency may increase, and for this reason I measure it.","Postposition phrase","tämän vuoksi","Tämän is genitive of tämä; vuoksi expresses a cause."],[335,"Academic connectors and phrases","tästä syystä","for this reason","Verkko voi häiriintyä, ja tästä syystä valvonta on tärkeää.","The network may be disrupted, and for this reason monitoring is important.","Adverbial phrase","tästä syystä","Tästä syystä means for this reason; both words are in the elative (-stä)."],[336,"Academic connectors and phrases","sen perusteella","based on it","Kerään dataa ja teen arvion sen perusteella.","I collect data and make an assessment based on it.","Postposition phrase","sen perusteella","Sen is genitive of se; perusteella means on the basis of."],[337,"Academic connectors and phrases","tulosten perusteella","based on the results","Tulosten perusteella voidaan arvioida menetelmää.","The method can be evaluated based on the results.","Postposition phrase","Tulosten perusteella","Tulosten is plural genitive of tulos; perusteella means based on."],[338,"Academic connectors and phrases","käytännössä","in practice","Käytännössä robotti tarvitsee turvallisen ohjauksen.","In practice, the robot needs safe control.","Adverb","Käytännöss
